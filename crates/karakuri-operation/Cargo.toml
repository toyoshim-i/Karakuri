[package]
name = "karakuri-operation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# **Nothing, and that is the whole point.** Every surface has to be able to
# depend on this — `karakuri-console` through `egui`, `karakuri-midi` through
# `midir`, `karakuri-cli` through all of it, and the MCP server — so a
# dependency here is a dependency each of them pays. It is `std` and no more:
# no device, no engine, no toolkit, no serialiser. See the crate documentation
# for what that forces, which is real and is stated rather than hidden.
[dependencies]
