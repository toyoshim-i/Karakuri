<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Karakuri — projector</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #karakuri-projector-canvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="karakuri-projector-canvas"></canvas>
  <script>
    function notifyReady() {
      if (window.opener && typeof window.opener.onKarakuriProjectorReady === 'function') {
        window.opener.onKarakuriProjectorReady(window);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', notifyReady);
    } else {
      notifyReady();
    }
  </script>
</body>
</html>
