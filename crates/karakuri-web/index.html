<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Karakuri Web</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111116;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #karakuri-canvas {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
  </style>
  <script>
    (function() {
      const host = window.location.hostname;
      const relayUrl = '/log';

      function sendLog(level, args) {
        try {
          const msg = Array.from(args).map(a => {
            if (typeof a === 'object') {
              try { return JSON.stringify(a); } catch(_) { return String(a); }
            }
            return String(a);
          }).join(' ');

          fetch(relayUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: `[${level.toUpperCase()}] ${msg}`,
            mode: 'cors',
          }).catch(() => {});
        } catch (_) {}
      }

      const origLog = console.log;
      const origWarn = console.warn;
      const origError = console.error;

      console.log = function(...args) {
        origLog.apply(console, args);
        sendLog('info', args);
      };
      console.warn = function(...args) {
        origWarn.apply(console, args);
        sendLog('warn', args);
      };
      console.error = function(...args) {
        origError.apply(console, args);
        sendLog('error', args);
      };

      window.addEventListener('error', (e) => {
        sendLog('error', [`Uncaught error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`]);
      });
      window.addEventListener('unhandledrejection', (e) => {
        sendLog('error', [`Unhandled rejection: ${e.reason}`]);
      });
    })();
  </script>
  <link rel="rust" data-trunk href="Cargo.toml" />
</head>
<body>
  <canvas id="karakuri-canvas"></canvas>
  <canvas id="karakuri-xr-canvas" width="1920" height="1080" style="position:fixed;left:-9999px;top:-9999px;width:1920px;height:1080px;visibility:hidden;"></canvas>
</body>
</html>
