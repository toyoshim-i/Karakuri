[package]
name = "karakuri-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
karakuri-console = { version = "0.1.0", path = "../karakuri-console" }
karakuri-engine.workspace = true
karakuri-environment = { version = "0.1.0", path = "../karakuri-environment" }
karakuri-ir.workspace = true
karakuri-layout = { version = "0.1.0", path = "../karakuri-layout" }
karakuri-operation = { version = "0.1.0", path = "../karakuri-operation" }
karakuri-operation-record = { version = "0.1.0", path = "../karakuri-operation-record" }
karakuri-pattern = { version = "0.1.0", path = "../karakuri-pattern" }
karakuri-signal.workspace = true
karakuri-store.workspace = true
karakuri-mcp = { version = "0.1.0", path = "../karakuri-mcp" }
karakuri = { version = "0.1.0", path = "../karakuri" }
serde.workspace = true
serde_json.workspace = true

wgpu = "30.0.1"
winit = { version = "0.30.13", features = ["rwh_06"] }
web-time = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlTextAreaElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "Window",
    "Navigator",
    "Location",
    "Performance",
    "Node",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Storage",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "AbortController",
    "AbortSignal",
    "Clipboard",
    "CacheStorage",
    "Cache",
    "Event",
    "CompositionEvent",
    "InputEvent",
    "KeyboardEvent",
]
