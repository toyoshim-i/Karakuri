[package]
name = "karakuri-environment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# **What is outside this process, and what it costs to reach it.** Every entry
# here is a door: `karakuri-audio` is a microphone, `png` and `wgpu` are a file
# and a device, `chrono` is the operator's calendar, `serde`/`serde_json` are
# the wire another program speaks. That is the charter (ADR-0215) showing up in
# the manifest — a dependency this package has no door for does not belong in
# it, and neither does the module that would have asked for one.
[dependencies]
karakuri-audio = { version = "0.1.0", path = "../karakuri-audio" }
karakuri-engine = { version = "0.1.0", path = "../karakuri-engine" }
karakuri-ir = { version = "0.1.0", path = "../karakuri-ir" }
karakuri-signal = { version = "0.1.0", path = "../karakuri-signal" }
karakuri-store = { version = "0.1.0", path = "../karakuri-store" }
png = "0.18.1"
wgpu = "30.0.1"
# **Local dates, for the edit history's directories.** The one thing needed of
# it is "what day is it where the operator is", so that a day's snapshots can be
# found and deleted by hand. `chrono` rather than `time`: `time`'s local-offset
# lookup is soundness-gated and returns nothing from a multi-threaded process on
# Unix, and a run always has an audio thread, a build worker and (with `--mcp`)
# a thread per connection running. It would have fallen back to UTC every time,
# which is the one thing the directory name must not do.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The tempo-source wire format is read at run time, not only in tests.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The scratch, the history and a session stream are directories on a disk, and
# the round trip is only worth checking against a real one.
tempfile = "3"
