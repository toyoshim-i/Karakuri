[package]
name = "karakuri-console"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The arrangement is built from the same pieces any other arrangement is, and
# nothing else is needed to state it: no toolkit, no device, no window. See
# ADR-0156 — the panel is a client of this tree, not its owner.
karakuri-layout = { version = "0.1.0", path = "../karakuri-layout" }

# **The vocabulary, because a control on this panel emits one of its
# operations.** ADR-0180: a leaf crate with no dependencies at all, so this
# costs the panel nothing it was refusing — `karakuri-operation` brings no
# toolkit, no device and no engine, and `panel` goes on being testable on a
# machine with no adapter. The mixer's two faders are its first customer: a
# drag becomes `Operation::SetGain` or `Operation::SetOpacity` and the panel
# does not apply it, because a GUI component is a translator and this crate has
# nothing to translate *into* (ADR-0156).
karakuri-operation = { version = "0.1.0", path = "../karakuri-operation" }

# **The view lives in this crate, so the toolkit is a dependency of it.**
# ADR-0155 chose `egui` and paid a `wgpu` major version for it; this is where
# that lands. The three move together and are re-exported from `lib.rs` for the
# same reason: a consumer that picked its own `egui-wgpu` could pick one that
# wants a different `wgpu`, and then the engine and the panel cannot share a
# device — which is the whole of what ADR-0155 bought.
#
# Checked on 2026-08-24 with the workspace on `wgpu` 30.0.1 and `winit` 0.30.13:
# one `wgpu`, one `winit` and one `naga` in `Cargo.lock`.
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"

[dev-dependencies]
# Only the round-trip test needs a concrete format; the arrangement itself is
# format-agnostic, exactly as `karakuri-layout` is.
serde_json.workspace = true

# `examples/panel.rs` only. The half of ADR-0156 that still holds is that the
# *arrangement* and `panel` pull in no toolkit, no device and no window and are
# tested with none; a surface, a device and an event loop are the example's,
# and stay dev-dependencies so that nothing in `src/` can reach for one.
#
# **The versions match `karakuri-engine`'s** — one `wgpu` and one `winit` in the
# workspace, so the example builds against the same device path the CLI opens a
# window with rather than resolving a second copy of either.
wgpu = "30.0.1"
winit = "0.30.13"
# For `Gpu`: instance, surface-compatible adapter, device and queue, in the one
# order a windowed caller needs them. Writing that again here would be a second
# answer to a question `karakuri-engine` already answers, and `pollster` is how
# its async constructor is reached off the event loop.
karakuri-engine.workspace = true
pollster = "1.0.1"
# **For one number: `BEATS_PER_BAR`, which the transport row's beat grid is as
# many dots as.** The deck's oscillator lives in this crate, so this is where
# how many beats a bar has is written down — and it is written down as
# *provisional*, a fixed assumption of common time until the IR format carries
# a real time signature. Transcribing the 4 into the example would be a copy
# that goes on saying four the day that changes; asking for it by name means
# the grid follows it. `view::Transport` still takes it as a number, so
# nothing in `src/` gains a dependency (ADR-0156).
karakuri-signal.workspace = true
# The `.kir` pair the example's Set is built from goes through parse and check
# before `Set::build` will take it, and those two stages are `karakuri-ir`'s.
# `karakuri-cli` reaches them the same way; there is no shorter route to a
# `Checked` and inventing one would be a second answer to *what does this
# procedure compile to*.
karakuri-ir.workspace = true
# **For `Record`, and for one pass of the example alone**: a fader's operation
# has to become a record before it reaches the deck (P-0028), and *where*
# `Operation` becomes `Record` is not decided — it needs `karakuri-operation`
# and `karakuri-store`, neither of which depends on the other. The example
# builds the two records itself and says so at the top of `record`; this
# dependency is that shortcut's, and it leaves with it.
karakuri-store.workspace = true

# **The example carries tests, so it is a test target.** Cargo builds an example
# under `cargo test` but does not run the tests inside one unless it is asked,
# and a test that the ordinary command does not run is a test that rots. Its
# device-touching test is under `mod gpu` like every other one in this
# workspace, so `--skip gpu::` still subtracts it.
[[example]]
name = "panel"
test = true
