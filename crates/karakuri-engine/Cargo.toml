[package]
name = "karakuri-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytemuck = "1.25.2"
karakuri-codegen = { version = "0.1.0", path = "../karakuri-codegen" }
karakuri-ir = { version = "0.1.0", path = "../karakuri-ir" }
karakuri-signal = { version = "0.1.0", path = "../karakuri-signal" }
karakuri-store = { version = "0.1.0", path = "../karakuri-store" }
pollster = "1.0.1"
serde.workspace = true
thiserror.workspace = true

wgpu = "30.0.1"
winit = "0.30.13"

[dev-dependencies]
# For the `tonemap_compare` example only: it writes PNGs the same way
# `karakuri-cli`'s `--render` does, so the comparison it produces is a
# preview of the real output path rather than a second one that might
# disagree with it.
png = "0.18.1"
